<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1000 Birres 🍻</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ESTILS CSS (Mòbil First / Mode fosc) */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px; /* Padding pensat per a mòbil */
        }

        /* Capçalera a l'esquerra */
        h1 {
            font-size: 1.75em;
            margin: 0 0 10px 0;
            color: #f39c12; /* Color cervesa */
            text-align: left;
        }

        hr {
            border: 0;
            border-top: 1px solid #333;
            margin-bottom: 25px;
        }

        /* Secció del total (es manté centrada perquè quedi espectacular) */
        .hero-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .total-title {
            font-size: 1.2em;
            color: #aaaaaa;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .total-number-container {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 10px;
        }

        .total-number {
            font-size: 5.5em; /* Més petit per cabre a mòbils */
            font-weight: bold;
            color: #ffffff;
        }

        .total-suffix {
            font-size: 1.5em;
            color: #f39c12;
        }

        /* Caixes d'estadístiques: adaptades a una sola línia */
        .stats-container {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: #1e1e1e;
            padding: 12px 5px;
            border-radius: 8px;
            flex: 1; /* Fan que totes ocupin el mateix ample */
            text-align: center;
            border: 2px solid #f39c12;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        .stat-box h3 {
            margin: 0 0 8px 0;
            color: #aaaaaa;
            font-size: 0.8em; /* Text petit per cabre */
            white-space: nowrap;
        }

        .stat-box p {
            font-size: 1.4em;
            font-weight: bold;
            margin: 0;
            color: #fff;
        }

        .stat-date {
            font-size: 0.65em;
            color: #888;
            margin-top: 5px;
            display: block;
        }

        /* Predicció simplificada */
        .prediction-container {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 35px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        .pred-falten {
            font-size: 1em;
            color: white;
            margin-bottom: 10px;
            text-align: left;
        }

        .pred-ritme {
            font-size: 1.5em;
            line-height: 1.5;
            color: #e0e0e0;
            text-align: left; /* Mantenim a l'esquerra */
        }

        /* Nova classe per centrar la data i els números */
        .pred-destacat {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #ffffff;
        }

        /* Gràfiques */
        .charts-container {
            margin-bottom: 40px;
        }

        .chart-wrapper {
            background: #1e1e1e;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        .chart-wrapper h3 {
            margin: 0 0 15px 0;
            font-size: 1em;
            color: #aaaaaa;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>1000 birres 🍻</h1>
        <div id="week-counter" class="week-counter">Setmana -</div>
    </div>
    <hr>

    <div class="hero-section">
        <div class="total-title">TOTAL</div>
        <div class="total-number-container">
            <div id="total-counter" class="total-number">0</div>
            <div class="total-suffix">birres🍻</div>
        </div>
    </div>

    <!-- Les 3 caixes en una línia -->
    <div class="stats-container">
        <div class="stat-box">
            <h3>Día 🔝</h3>
            <p id="max-beers">0</p>
            <span id="max-date" class="stat-date">-</span>
        </div>
        <div class="stat-box">
            <h3>Mitjana</h3>
            <p id="avg-beers">0</p>
            <span class="stat-date">birres/dijous</span>
        </div>
        <div class="stat-box">
            <h3>Día ⬇️</h3>
            <p id="min-beers">0</p>
            <span id="min-date" class="stat-date">-</span>
        </div>
    </div>

    <!-- Predicció senzilla -->
    <div class="prediction-container">
        <div id="pred-falten" class="pred-falten">Calculant...</div>
        <div id="pred-ritme" class="pred-ritme"></div>
    </div>

    <!-- Gràfiques Separades -->
    <div class="charts-container">
        <div class="chart-wrapper">
            <h3>Birres cada Dijous</h3>
            <canvas id="dailyChart"></canvas>
        </div>
        <div class="chart-wrapper">
            <h3>Acumulat Total</h3>
            <canvas id="cumulativeChart"></canvas>
        </div>
    </div>

    <!-- LÒGICA JAVASCRIPT -->
    <script>
        // -------------------------------------------------------------
        // ARRAY PER ACTUALITZAR (Afegir les birres separades per comes)
        // -------------------------------------------------------------
        const beersData = [29, 32, 30, 31, 24, 34, 0, 0, 27, 35]; 
        
        const START_DATE = new Date('2026-09-03T00:00:00');

        function getThursdayDate(indexOffset) {
            const d = new Date(START_DATE);
            d.setDate(d.getDate() + (indexOffset * 7));
            return d.toLocaleDateString('ca-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        let totalBirres = 0;
        let maxBirres = -1;
        let maxIndex = 0;
        let minBirres = Infinity;
        let minIndex = 0;

        // Processar dades base
        for (let i = 0; i < beersData.length; i++) {
            const b = beersData[i];
            totalBirres += b;
            
            if (b > maxBirres) {
                maxBirres = b;
                maxIndex = i;
            }
            if (b > 0 && b < minBirres) {
                minBirres = b;
                minIndex = i;
            }
        }

        const avgBirres = (totalBirres / beersData.length) || 0;
        const remaining = 1000 - totalBirres;

        document.getElementById('week-counter').innerText = `Setmana ${beersData.length}`;

        // Omplir estadístiques HTML
        document.getElementById('max-beers').innerText = maxBirres >= 0 ? maxBirres : 0;
        document.getElementById('max-date').innerText = beersData.length > 0 ? getThursdayDate(maxIndex) : '-';
        
        document.getElementById('avg-beers').innerText = avgBirres.toFixed(1);
        
        if (minBirres !== Infinity) {
            document.getElementById('min-beers').innerText = minBirres;
            document.getElementById('min-date').innerText = getThursdayDate(minIndex);
        } else {
            document.getElementById('min-beers').innerText = '0';
            document.getElementById('min-date').innerText = '-';
        }

        // Càlcul de la predicció i extensió del calendari
        let weeksNeeded = 0;
        let finalIndex = beersData.length - 1;

        const predFalten = document.getElementById('pred-falten');
        const predRitme = document.getElementById('pred-ritme');

        if (remaining <= 0) {
            predFalten.innerText = "Repte aconseguit! 🍻";
            predFalten.style.color = "#2ecc71";
            predRitme.innerText = `Heu aconseguit arribar a les 1000 birres en ${beersData.length} setmanes!`;
        } else if (avgBirres > 0) {
            weeksNeeded = Math.ceil(remaining / avgBirres);
            finalIndex = beersData.length + weeksNeeded - 1;
            const finalDate = getThursdayDate(finalIndex);
            // Format sense decimals per quedar més net en aquesta vista
            const finalBeers = Math.round(1000 - remaining + (avgBirres * weeksNeeded));
            
            predFalten.innerText = `Falten: ${remaining} birres`;
            
            // Aquí apliquem la classe nova per centrar només el dia i el resultat
            predRitme.innerHTML = `Acabarem el: <span class="pred-destacat"><strong>${finalDate}</strong>,</span> fent <span class="pred-destacat"><strong>${finalBeers}</strong></span> birres en total.`;
        } else {
            predFalten.innerText = "Falten: 1000 birres";
            predRitme.innerText = "Comenceu a beure per calcular la predicció!";
        }

        // Preparar dades exteses per a les gràfiques (X-axis fins al final)
        let labels = [];
        let dailyData = [];
        let cumulativeData = [];
        
        // NOUS ARRAYS PER LES LÍNIES DE REFERÈNCIA
        let avgData = [];
        let goalData = [];
        
        let tempAcumulat = 0;

        const totalDiasGràfica = beersData.length;

        for (let i = 0; i < totalDiasGràfica; i++) {
            labels.push(getThursdayDate(i));
            
            // Omplim les línies de referència amb els valors fixos per a cada punt
            avgData.push(avgBirres);
            goalData.push(1000);
            
            if (i < beersData.length) {
                dailyData.push(beersData[i]);
                tempAcumulat += beersData[i];
                cumulativeData.push(tempAcumulat);
            } else {
                dailyData.push(null);
                cumulativeData.push(null);
            }
        }

        // ANIMACIÓ DEL CONTADOR AMB LOCALSTORAGE
        const counterEl = document.getElementById('total-counter');
        const storedTotal = localStorage.getItem('totalBirres');
        let startVal = 0;

        if (storedTotal !== null && !isNaN(storedTotal)) {
            const parsedStored = parseInt(storedTotal, 10);
            if (parsedStored < totalBirres) {
                startVal = parsedStored;
            } else {
                startVal = totalBirres; 
            }
        }
        localStorage.setItem('totalBirres', totalBirres);

        const animDuration = 2000;
        const startTime = performance.now();

        function animateCounter(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / animDuration, 1);
            const easeOut = 1 - (1 - progress) * (1 - progress);
            const currentVal = Math.floor(startVal + (totalBirres - startVal) * easeOut);
            
            counterEl.innerText = currentVal;
            
            if (progress < 1) {
                requestAnimationFrame(animateCounter);
            } else {
                counterEl.innerText = totalBirres;
            }
        }

        if (startVal < totalBirres) {
            requestAnimationFrame(animateCounter);
        } else {
            counterEl.innerText = totalBirres;
        }

        // CONFIGURACIÓ COMUNA PER LES GRÀFIQUES
        const commonOptions = {
            responsive: true,
            spanGaps: false, // Això evita que Chart.js uneixi punts buits del futur
            interaction: { mode: 'index', intersect: false },
            scales: {
                x: { 
                    ticks: { color: '#aaaaaa', maxRotation: 45, minRotation: 45 },
                    grid: { color: 'rgba(255,255,255,0.05)' } 
                },
                y: { 
                    beginAtZero: true, 
                    ticks: { color: '#aaaaaa' },
                    grid: { color: 'rgba(255,255,255,0.1)' } 
                }
            },
            plugins: {
                legend: { display: false }, // Ocultem la llegenda per estalviar espai a mòbil
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return ` ${context.parsed.y} birres`;
                        }
                    }
                }
            }
        };

        // Gràfica 1: Diària (Línia + Mitjana)
        const ctxDaily = document.getElementById('dailyChart').getContext('2d');
        new Chart(ctxDaily, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        data: dailyData,
                        borderColor: '#f39c12',
                        backgroundColor: 'rgba(243, 156, 18, 0.2)',
                        borderWidth: 3,
                        pointBackgroundColor: '#fff',
                        pointRadius: 4,
                        tension: 0.3,
                        fill: true 
                    },
                    {
                        label: 'Mitjana',
                        data: avgData,
                        borderColor: 'rgba(255, 255, 255, 0.4)', // Blanc semi-transparent
                        borderWidth: 2,
                        borderDash: [5, 5], // Fica la línia discontínua (5px línia, 5px espai buit)
                        pointRadius: 0, // Amaga els cercles dels punts
                        fill: false,
                        tension: 0 // Línia totalment recta
                    }
                ]
            },
            options: commonOptions
        });

        // Gràfica 2: Acumulat (Línia + Objectiu 1000)
        const ctxCumulative = document.getElementById('cumulativeChart').getContext('2d');
        new Chart(ctxCumulative, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        data: cumulativeData,
                        borderColor: '#3498db',
                        backgroundColor: 'rgba(52, 152, 219, 0.2)',
                        borderWidth: 3,
                        pointBackgroundColor: '#fff',
                        pointRadius: 4,
                        tension: 0.3,
                        fill: true
                    },
                    {
                        label: 'Objectiu (1000)',
                        data: goalData,
                        borderColor: 'rgba(46, 204, 113, 0.8)', // Color verd per l'objectiu
                        borderWidth: 2,
                        borderDash: [5, 5],
                        pointRadius: 0,
                        fill: false,
                        tension: 0
                    }
                ]
            },
            options: commonOptions
        });
    </script>
</body>
</html>
